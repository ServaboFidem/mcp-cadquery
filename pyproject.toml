[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cadquery-server"
version = "0.1.0"
authors = [
  { name="AI Assistant Roo", email="roo@example.com" },
]
description = "A FastAPI MCP server for CadQuery operations"
readme = "README.md"
# Bumped from >=3.10 by the local dxl shim commit: the FastMCP stdio shim
# (src/cadquery_dxl_mcp) is verified on 3.12 only (.python-version pins it).
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License", # Choose appropriate license
    "Operating System :: OS Independent",
]
# Dependencies moved from requirements.txt
dependencies = [
    "cadquery==2.5.2",
    # Local dxl shim commit: the FastMCP stdio shim needs the MCP SDK.
    "mcp>=2.2",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "typer[all]",
    "python-multipart", # Often needed by FastAPI for form data/uploads
    "importlib-resources; python_version<'3.10'", # Backport if needed for older pythons
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx", # For potential future API integration tests
]

[project.scripts]
# This creates the 'mcp-cadquery' command that points to the Typer app
mcp-cadquery = "mcp_cadquery_server.cli:cli"
# Local dxl shim commit: the FastMCP stdio shim entry point (dxl-mcp-proxy
# spawns this, never the Typer app -- see docs/superpowers/specs/2026-10-23-cadquery-mcp-design.md).
cadquery-dxl-mcp = "cadquery_dxl_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]  # Look for packages in src/